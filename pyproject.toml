[project]
name = "md-simulations"
version = "0.1.0"
description = "Standalone molecular dynamics simulation engines (OpenMM + GROMACS), config-driven and cluster-ready."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jonas Hummerich", email = "hummerich@thphys.uni-heidelberg.de" },
]
# Core + all extras except cgschnet run on 3.10-3.12. The cgschnet extra pins
# 3.12 (mlcg is ==3.12.*) via a marker below, so it is simply unavailable on
# 3.10/3.11 rather than forcing the whole project (and its consumers) to 3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pinned: batched CGSchNet replicas are logged through beamtime's internal run API
    # (core/tracking.py), which a new release may change.
    "beamtime==0.1.1",
    "openmm>=8.4.0.post2",
    "mdtraj>=1.10.3",
    "parmed>=4.3.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# Resolves openawsem from PyPI. CAVEAT: release 1.1.1 is missing the `PDBParser`
# and `product` imports inside `read_memory` (functionTerms/templateTerms.py), so
# any config with `use_associative_memory: true` raises NameError. Until that is
# fixed upstream, point [tool.uv.sources] at a patched checkout *in your own
# top-level project* (not here -- see the note in [tool.uv.sources] below).
awsem = ["openawsem"]
martini = ["vermouth>=0.15.0", "insane>=1.2.0"]
# gromacs: requires an external `gmx` binary on PATH (module load gromacs/...).
gromacs = []
# ML coarse-grained (CGSchNet / Clementi-group mlcg). Dynamics run via mlcg's own
# Langevin integrator, so mlcg is the only requirement. mlcg pins Python ==3.12.*,
# so the dependency is marker-gated and this extra resolves to nothing on 3.10/3.11
# (use a 3.12 env for cgschnet).
# Deliberately plain `mlcg`, NOT `mlcg[cu130]`: the cu130 extra pins torch==2.11.0
# and routes torch-cluster + cuequivariance through the CUDA-13 wheel indexes, which
# fights any consumer that pins its own torch. The CUDA line is a separate opt-in --
# see the `cu130` extra below.
cgschnet = [
    "mlcg; python_full_version >= '3.12'",
]
# The CUDA-13 wheel set for the cgschnet stack, matching the cluster's cuda/13.0.
# Orthogonal to the cgschnet extras: add it when this project *is* the top-level one
# and needs the CUDA-13 torch, and install torch with the matching backend
# (`uv sync --extra cgschnet --extra cu130 --torch-backend=cu130`). It needs the
# [tool.uv] index setup below. A consumer that pins its own torch takes `cgschnet`
# alone and keeps its CUDA line.
cu130 = [
    "mlcg[cu130]; python_full_version >= '3.12'",
]
viz = ["matplotlib>=3.8", "scienceplots>=2.2.0"]
# Trajectory analysis (TICA and related dimensionality reduction).
analysis = ["deeptime>=0.4.4", "scipy>=1.11"]
# Differentiable torch potentials built from a config (see
# md_simulations.torch_potentials). openmm is already a core dep, so
# OpenMMCalculator needs nothing extra; ase supplies the engine-agnostic
# calculator contract and torch the autograd bridge. `torch` is deliberately not
# pinned to an index (see [tool.uv.sources]), so it resolves from PyPI unless the
# top-level project says otherwise -- e.g. `--torch-backend=cu130` or `=cpu`.
torch-potentials = ["torch>=2.0", "ase>=3.22"]
# The differentiable CG potential (md_simulations.torch_potentials.cgschnet) needs
# both halves: mlcg to unpickle and run the model, torch/ase for the rest of the
# package. mlcg pins Python ==3.12.*, so its half is marker-gated and this extra
# degrades to plain torch-potentials on 3.10/3.11 -- where CGSchNetPotential simply
# cannot be built. Plain mlcg, so a consumer keeps its own torch; add `cu130` for
# the CUDA-13 stack.
cgschnet-potentials = [
    "md-simulations[torch-potentials]",
    "md-simulations[cgschnet]",
]
# Building a CGSchNet force-matching dataset (md_simulations.prep.cgschnet_dataset):
# aggforce fits the AA->CG force map, h5py writes the dataset mlcg trains from, and
# the prior-force subtraction needs the differentiable CG potential. aggforce and
# h5py both arrive with mlcg today, but this extra states the dependency rather than
# relying on that.
cgschnet-dataset = [
    "md-simulations[cgschnet-potentials]",
    "h5py>=3.10",
]
# Everything at once. NOTE: `all` includes `cu130`, so it inherits the heavy CUDA-13
# torch stack and needs the [tool.uv] cu130 index setup below (and a CUDA-13 host, or
# a `--torch-backend` override) -- same constraint the standalone `cu130` extra
# carries. Drop `cu130` from the list to keep a different CUDA line.
all = [
    "md-simulations[awsem,martini,gromacs,cgschnet,cu130,viz,analysis,torch-potentials]",
]

[project.urls]
Homepage = "https://github.com/hummerichsander/md-simulations"
Repository = "https://github.com/hummerichsander/md-simulations"

[dependency-groups]
# Installed by default with `uv sync` / kept by `uv run` (unlike extras).
dev = ["ruff>=0.14.10", "pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
md-sim = "md_simulations.cli:main"
md-sim-umbrella = "md_simulations.sampling.umbrella:main"
md-sim-relax = "md_simulations.sampling.relax:main"
md-sim-resample-hbonds = "md_simulations.sampling.resample_h_bonds:main"
md-sim-cgschnet-map = "md_simulations.prep.cgschnet_map:main"
md-sim-cgschnet-embeddings = "md_simulations.prep.cgschnet_embeddings:main"
md-sim-cgschnet-reexport = "md_simulations.prep.cgschnet_reexport:main"
md-sim-cgschnet-dataset = "md_simulations.prep.cgschnet_dataset:main"
md-sim-cgschnet-finetune = "md_simulations.prep.cgschnet_finetune:main"
md-sim-cgschnet-priors = "md_simulations.prep.cgschnet_priors:main"
md-sim-tica = "md_simulations.analysis.tica:main"
md-sim-cvs = "md_simulations.analysis.cvs:main"
md-sim-basins = "md_simulations.analysis.basins:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_simulations"]

[tool.uv]
# mace-torch 0.3.16 over-pins e3nn==0.4.4 while mlcg needs e3nn 0.5.3. mlcg's own
# pyproject applies this same override, but uv only honors override/index config
# from the top-level project, so it must be repeated here (mlcg is a git dep).
override-dependencies = ["e3nn==0.5.3"]
# Fallback: build torch-cluster from source (against the installed torch) if no
# pre-built PyG wheel matches the platform.
no-build-isolation-package = ["torch-cluster"]
# python-hostlist 2.3.0 (mlcg -> mace-torch) is sdist-only and its setup.py calls
# the `install_data` command, which setuptools 80 removed -- the build fails with
# `error: invalid command 'install_data'` unless the build env is held back.
build-constraint-dependencies = ["setuptools<80"]
# Needed so torch's transitive nvidia-* deps resolve across the torch/PyG indexes.
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# Deliberately NO openawsem entry: uv *does* apply a git/path dependency's own
# [tool.uv.sources], so a machine-local `openawsem = { path = ... }` here gets
# rewritten relative to this repo's checkout and then collides with the consuming
# project's own openawsem source ("conflicting URLs for package openawsem").
# openawsem therefore resolves from PyPI by default. See the `awsem` extra above
# for the patch that release is missing.
mlcg = { git = "https://github.com/ClementiGroup/mlcg.git" }
# CUDA-13 wheels for the `cu130` extra (mirrors mlcg's cu130 setup, which uv does
# not inherit from a dependency).
# Deliberately NO torch / torch-cluster index pins. uv applies a git dependency's
# own [tool.uv.sources], so pinning torch to the cu130 index here forced that CUDA
# line on every consumer -- and mixing it with PyPI-resolved nvidia-* wheels yields
# an inconsistent stack (missing libcudnn.so.9 / libcusparseLt.so.0, i.e. `import
# torch` fails outright). The CUDA line is the top-level project's call: here, install
# with `uv sync --extra cgschnet --extra cu130 --torch-backend=cu130`; a consumer that
# pins its own torch takes `cgschnet` without `cu130` and adds its own index pins. The
# index definitions are kept (explicit, so they are only consulted when something is
# pinned to them).

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.11.0+cu130.html"
format = "flat"

[tool.ruff]
# 100 rather than the default 88, matching how torch_potentials/ was written. The
# enforced gate is `ruff check`, whose default rule set has no line-length rule, so
# this only affects `ruff format`. The tree is format-clean at this width as of the
# reformat commit, so `ruff format --check` is now meaningful -- keep it that way,
# and do not change the width without reformatting in the same commit.
line-length = 100
exclude = [
    "tests",
    ".venv",
    "__pycache__",
    "*.egg-info",
    # Vendored third-party script kept verbatim (see its header/citation).
    "src/md_simulations/prep/olives.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
