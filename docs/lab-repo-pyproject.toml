# Draft pyproject.toml for the lab repo /remote/gpu04/hummerich/projects/simulations, to be
# copied there by the user as `pyproject.toml` (S3 of docs/plans/split-package-and-lab.md creates
# the repo). Delete these three comment lines when copying.
#
# The lab repo is an application, not a library: it installs the md-simulations package with
# everything a research session touches (MD stack, analysis, plotting, the agent server, the
# CGSchNet potentials) plus the notebook tooling, which deliberately does not live in the package.
[project]
name = "simulations"
version = "0.1.0"
description = "Configs, job scripts and the Beamtime log for the lab's md-simulations campaigns."
readme = "README.md"
# cgschnet-dataset (which includes cgschnet-potentials) pulls mlcg, which needs 3.12 (marker-gated,
# so on 3.10/3.11 the extra would silently resolve to plain torch-potentials) and h5py. The lab runs
# the CGSchNet campaigns, and its job scripts call md-sim-cgschnet-dataset and -priors. `prep`
# (mdtraj, networkx) is what the vendored prep/olives.py imports at module scope.
requires-python = ">=3.12,<3.13"
dependencies = [
    "md-simulations[simulate,analysis,viz,mcp,awsem,martini,prep,cgschnet-dataset]",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
# The CUDA-13 stack for the cluster's cuda/13.0: the CUDA-13 OpenMM platform (a
# `platform: CUDA` job needs it, otherwise it silently has no GPU) and the CUDA-13 torch for
# CGSchNet. Install with `uv sync --extra cu130 --torch-backend=cu130`; needs the cu130 index
# blocks below. On a host without a GPU, leave it out.
cu130 = ["md-simulations[cu130]"]

[dependency-groups]
# Installed by default with `uv sync`. beamtime[serve] is the `beamtime` binary that `.mcp.json`
# starts as the run-state MCP server.
dev = [
    "ruff>=0.14.10",
    "beamtime[serve]>=0.1.1",
]

[tool.uv.sources]
# The package is the sibling checkout, editable, so a change in md-simulations shows up here
# without a reinstall. Anywhere else (CI, a second machine) use the git URL instead:
#   md-simulations = { git = "https://github.com/hummerichsander/md-simulations" }
md-simulations = { path = "../md-simulations", editable = true }
# Pinned, and the pin MUST stay byte-identical to md-simulations' own entry and to every other
# consumer's (split-flows): two different URLs for one package are a hard error in uv ("conflicting
# URLs for package `mlcg`"), and the CGSchNet checkpoints are pickled against this mlcg /
# torch-geometric pair. Bump it in md-simulations, here and in every consumer in the same change.
mlcg = { git = "https://github.com/ClementiGroup/mlcg.git", rev = "b0162fe8604e2a14972e2906957ab8444a310a43" }

[tool.uv]
# uv honours override, constraint and index configuration only from the top-level project, and
# this repo is top-level in its own right, so the package's cluster settings are repeated here
# (the package keeps its copy for its own dev venv). Keep both in step.
#
# mace-torch 0.3.16 over-pins e3nn==0.4.4 while mlcg needs e3nn 0.5.3.
override-dependencies = ["e3nn==0.5.3"]
# Fallback: build torch-cluster from source (against the installed torch) if no pre-built PyG
# wheel matches the platform.
no-build-isolation-package = ["torch-cluster"]
# python-hostlist 2.3.0 (mlcg -> mace-torch) is sdist-only and its setup.py calls the
# `install_data` command, which setuptools 80 removed.
build-constraint-dependencies = ["setuptools<80"]
# Hold the CUDA toolkit on the 13.1 line: the cluster's driver (590.48.01) tops out at CUDA 13.1,
# and a newer nvrtc emits PTX the driver cannot JIT (`CUDA_ERROR_UNSUPPORTED_PTX_VERSION (222)`
# at Context creation). Inert unless the cu130 extra pulls the nvidia-* wheels in. Raise the
# bound when the driver is updated -- check `nvidia-smi` "CUDA Version".
constraint-dependencies = [
    "nvidia-cuda-nvrtc<13.2",
    "nvidia-cuda-nvcc<13.2",
]
# Needed so torch's transitive nvidia-* deps resolve across the torch/PyG indexes.
index-strategy = "unsafe-best-match"

# CUDA-13 wheels for the `cu130` extra. Explicit, so they are only consulted when a package is
# pinned to them; `--torch-backend=cu130` supplies the torch pin.
[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.11.0+cu130.html"
format = "flat"
