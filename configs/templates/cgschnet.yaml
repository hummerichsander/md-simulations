# Template: ML coarse-grained (CGSchNet / mlcg) MD via mlcg's own Langevin integrator.
# Requires the 'cgschnet' extra (uv sync --extra cgschnet; the project is Python 3.12).
# Prepare artifacts first (see README):
#   - Re-export the checkpoint:  md-sim-cgschnet-reexport <model>.pt -o <model>.reexport.pt
#   - Obtain an mlcg configurations .pt (List[AtomicData] with pos/atom_types/masses/neighbor lists).
engine: cgschnet                       # engine selector (do not change)
system: my-protein                     # short system name (shown in logs/summary)
output_subdir: my-protein/CGSchNet_350K # output directory, relative to the data root
# data_root: /path/to/data             # optional; else use --data-root or MD_DATA_ROOT

input_pdb: my-protein/cg/cg.pdb        # CG PDB, used ONLY as the output topology (one atom per
                                       #   bead); a generic bead topology is synthesized if it
                                       #   does not match the configuration's bead count
configurations_file: my-protein/cg/configurations.pt   # mlcg List[AtomicData] (initial frames)
model_file: models/cgschnet/model_and_prior.reexport.pt # re-exported mlcg model + prior

device: cuda                           # torch device: cuda | cpu
dtype: float32                         # model precision: float32 | float64
model_energy_unit: kcal/mol            # model's energy unit (sets beta = 1/kB·T): kcal/mol | kJ/mol
replica: 0                             # starting index into the configurations list
n_replicas: 1                          # parallel replicas, batched into one forward per step
                                       #   — the main throughput lever (a single CG molecule
                                       #   badly underuses the GPU). Set to e.g. the number of
                                       #   starting structures in configurations.pt; each
                                       #   replica writes its own trajectory_NN.* files.

num_steps: 10000000                    # total integration steps
output_freq: 1000                      # steps between saved trajectory / energy / force frames
report_interval: 1000                  # (unused by cgschnet; mlcg shows its own progress bar)
temperature: 350                       # temperature (K)
friction: 1.0                          # Langevin friction coefficient (ps^-1)
timestep: 0.002                        # integration timestep (ps)
minimize_energy: false                 # NN potentials are run without minimisation
log_level: INFO                        # DEBUG | INFO | WARNING | ERROR | CRITICAL

slurm:
  job_name: md-my-protein-cgschnet     # SBATCH --job-name
  partition: a30                       # SBATCH --partition
  gres: gpu:1                          # SBATCH --gres (GPU strongly recommended)
  time: 0-24:00:00                     # SBATCH --time (D-HH:MM:SS)
  mem: 20G                             # SBATCH --mem
