# Template: OpenAWSEM coarse-grained MD (3-bead CG, implicit solvent).
# Requires the 'awsem' extra: uv sync --extra awsem
engine: awsem                          # engine selector (do not change)
system: my-protein                     # short system name (shown in logs/summary)
output_subdir: my-protein/AWSEM_300K   # output directory, relative to the data root
# data_root: /path/to/data             # optional; else use --data-root or MD_DATA_ROOT

input_pdb: pdbs/input.pdb              # input PDB, relative to data root
prepare: true                          # true = convert all-atom PDB to 3-bead CG first
cis_proline: false                     # use cis-proline geometry during preparation
chains: A                              # chain IDs to include, e.g. "A" or "AB"
parameters_dir: null                   # AWSEM parameter dir; null = package defaults
k_awsem: 1.0                           # global AWSEM energy scale factor

use_contact: true                      # residue-residue contact term
use_burial: true                       # single-residue burial free-energy term
use_rama: true                         # Ramachandran backbone dihedral term
use_beta: true                         # beta-sheet hydrogen-bond term
use_helical: false                     # alpha-helix hydrogen-bond term
use_electrostatics: true               # Debye-Hückel screened electrostatics
k_contact: 4.184                       # contact-term energy scale (kJ/mol)
k_beta: 4.184                          # beta H-bond term energy scale (kJ/mol)

use_associative_memory: false          # enable the associative-memory (AM) bias
memory_pdbs: []                        # template PDB path(s) used as memories
memory_chains: []                      # chain per memory (default A)
memory_weights: []                     # weight gamma per memory (default 0.5)
memory_target_starts: []               # residue in the simulated protein per fragment (1-based)
memory_fragment_starts: []             # residue in the template PDB per fragment (1-based)
memory_lengths: []                     # residues covered per fragment (default full length)
k_am: 0.8368                           # overall AM energy scale (kJ/mol)
am_min_seq_sep: 2                      # minimum sequence separation |i-j| for AM pairs
am_max_seq_sep: 9                      # maximum sequence separation |i-j| for AM pairs
am_well_width: 0.1                     # Gaussian well width scale sigma0 (nm)

num_steps: 50000000                    # total integration steps
output_freq: 1000                      # steps between trajectory / energy / force writes
report_interval: 1000                  # steps between stdout progress reports
temperature: 300                       # temperature (K)
friction: 1.0                          # Langevin friction coefficient (ps^-1)
timestep: 0.002                        # integration timestep (ps)
integrator: langevin                   # langevin | langevin_middle
minimize_energy: true                  # energy-minimise before production
log_level: INFO                        # DEBUG | INFO | WARNING | ERROR | CRITICAL

slurm:
  job_name: md-my-protein              # SBATCH --job-name
  partition: a30                       # SBATCH --partition
  gres: gpu:1                          # SBATCH --gres
  time: 0-24:00:00                     # SBATCH --time (D-HH:MM:SS)
  mem: 20G                             # SBATCH --mem
