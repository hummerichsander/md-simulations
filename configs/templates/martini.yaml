# Template: MARTINI3 coarse-grained MD in OpenMM, from GROMACS GRO/TOP inputs.
# Copy to configs/<name>.yaml.
engine: martini                        # engine selector (do not change)
system: my-cg                          # short system name (shown in logs/summary)
output_subdir: my-cg/MARTINI_300K      # output directory, relative to the data root
# data_root: /path/to/data             # optional; else use --data-root or MD_DATA_ROOT

input_gro: my-cg/solvated.gro          # CG coordinates (GRO), relative to data root
top: my-cg/system.top                  # GROMACS topology (TOP), relative to data root
include_dir: martini_v300/martini_v300 # dir with MARTINI ITP files referenced by the TOP
cutoff: 1.1                            # nonbonded cutoff (nm); MARTINI3 standard is 1.1
pressure: null                         # NPT barostat pressure (bar); null = NVT

num_steps: 250000000                   # total integration steps
output_freq: 50                        # steps between trajectory / energy / force writes
report_interval: 1000                  # steps between stdout progress reports
temperature: 300                       # temperature (K)
friction: 1.0                          # Langevin friction coefficient (ps^-1)
timestep: 0.020                        # integration timestep (ps); MARTINI3 uses ~20 fs
integrator: langevin                   # langevin | langevin_middle
minimize_energy: true                  # energy-minimise before production
log_level: INFO                        # DEBUG | INFO | WARNING | ERROR | CRITICAL

slurm:
  job_name: md-my-cg                   # SBATCH --job-name
  partition: gshort                    # SBATCH --partition
  gres: gpu:1                          # SBATCH --gres (gpu:0 to run on CPU)
  time: 0-40:00:00                     # SBATCH --time (D-HH:MM:SS)
  mem: 20G                             # SBATCH --mem
