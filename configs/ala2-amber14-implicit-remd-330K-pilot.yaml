# Poly-alanine ala2, all-atom AMBER14 + GBn2 implicit solvent, T-REMD pilot with a 330 K target.
#
# Calibrates the production T-REMD runs (train / holdout) of ala2. The plain-MD replica set r0-r3
# did not converge the alpha_L basin (Beamtime alaX, verdicts of 2026-11-06). The pilot measures:
# swap acceptance per pair, round-trip time, alpha_L entry rate at every temperature (to choose
# t_max), and speed. Hence the wide ladder (330-600 K, 4 rungs, ~45 % estimated harmonic
# acceptance; real acceptance is lower) and full output at every temperature.
#
# Same potential, integrator and start as the plain-MD runs: helix start (pdbs/ala2.pdb),
# LangevinMiddle, 2 fs, hbonds, friction 1/ps. 2 ns per replica.
engine: amber
system: ala2
output_subdir: alaX/ala2_AMBER14_implicit_remd_330K-pilot
beamtime:
  group: alaX/ala2_AMBER14_implicit_remd_330K
  name: pilot

input_pdb: pdbs/ala2.pdb
forcefield:
  - amber14-all.xml
  - implicit/gbn2.xml
ph: 7.0
implicit_solvent: true
salt_conc: 0.0
nonbonded_cutoff: 2.0

num_steps: 1000000        # 1,000,000 steps = 2 ns per replica
output_freq: 250          # 330 K frames every 0.5 ps -> 4,000 frames
report_interval: 50000    # log every 100 ps
temperature: 330
friction: 1.0
timestep: 0.002
integrator: langevin_middle

replica_exchange:
  t_max: 600
  n_replicas: 4
  exchange_interval: 250      # 0.5 ps
  other_output: full          # DCD + forces + energies at every temperature, for alpha_L counts
  other_output_freq: 500      # 1 ps
  checkpoint_interval: 50000  # 100 ps
  # no seed: fresh integrator and exchange streams per run

slurm:
  job_name: ala2-amber14-implicit-remd-330K-pilot
  partition: a30
  gres: gpu:1
  time: 0-12:00:00
  mem: 20G
