# Poly-alanine ala2, all-atom AMBER14 + GBn2 implicit solvent, plain MD at 600 K.
#
# The hot endpoint of the pair {300 K, 600 K}; the twin of
# ala2-amber14-implicit-endpoints-300K.yaml, which carries the full rationale. Classical,
# non-exchanging MD: this is an ordinary 600 K canonical ensemble, not the top rung of a ladder.
# 600 K is the t_max of ala2-amber14-implicit-remd-330K-{pilot,train}, chosen there because even
# at 600 K alpha_L is crossed only ~1-3 times per ns along a replica's own path.
#
# Everything except `temperature`, `output_subdir` and the beamtime/slurm blocks is identical to
# the 300 K twin, so the pair differs in temperature alone. 2 fs with `constraints: hbonds` is
# stable at 600 K: the 600 K replica of the REMD train run uses exactly this integrator, timestep
# and constraint set.
#
# At 600 K the trajectory decorrelates far faster than at 300 K, so the same 350 ns holds many
# more independent configurations -- the two runs have equal frame counts, not equal statistical
# weight. Same ideal alpha-helix start (pdbs/ala2.pdb) as the 300 K twin and the REMD runs;
# 1 ns of the start is burn-in, and at 600 K the helix melts well inside it.
engine: amber
system: ala2
output_subdir: alaX/ala2_AMBER14_implicit_600K
beamtime:
  group: alaX/ala2_AMBER14_implicit_endpoints
  name: 600K

input_pdb: pdbs/ala2.pdb
forcefield:
  - amber14-all.xml
  - implicit/gbn2.xml
ph: 7.0
implicit_solvent: true
salt_conc: 0.0
nonbonded_cutoff: 2.0
constraints: hbonds

num_steps: 175000000      # 175,000,000 steps = 350 ns
output_freq: 500          # a frame every 1 ps -> 350,000 frames
report_interval: 50000    # stdout log every 100 ps
temperature: 600
friction: 1.0
timestep: 0.002
integrator: langevin_middle
