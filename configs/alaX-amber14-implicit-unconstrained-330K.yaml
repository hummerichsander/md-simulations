# Poly-alanine (ala-X), AMBER14 + GBn2 implicit solvent, 330 K, WITHOUT bond constraints.
#
# The twin of alaX-amber14-implicit-330K.yaml. See the header of
# trpcage-amber14-implicit-unconstrained-300K.yaml for why this exists: under `constraints: hbonds`
# OpenMM deletes the harmonic bond term of every constrained bond, so the energy does not score the
# X-H bond lengths at all. Use this file both to resample the reference trajectories' X-H bonds
# (slurm/resample-h-bonds-alaX.sh) and as the reweighting target they are then scored against.
#
# Like its twin this is a template over the chain length: `ala12` below is swapped per system.
#
# Not intended for production MD; the timestep resolves the unconstrained X-H stretch (~11 fs).
engine: amber
system: ala12
output_subdir: alaX/ala12_AMBER14_implicit_unconstrained_330K

input_pdb: pdbs/ala12.pdb
forcefield:
  - amber14-all.xml
  - implicit/gbn2.xml
ph: 7.0
implicit_solvent: true
salt_conc: 0.0
nonbonded_cutoff: 2.0
constraints: none

num_steps: 20000000
output_freq: 4
report_interval: 200000
temperature: 330
friction: 1.0
timestep: 0.0005
integrator: langevin_middle
