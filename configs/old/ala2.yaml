# Alanine dipeptide (ala2), all-atom AMBER14 + TIP3P-FB, explicit, 360 K.
# Ported from split-flows-public/slurm/md_simulation_alanine_dipeptide_openmm.sh
engine: amber
system: ala2
output_subdir: ala2/AMBER14_360K

input_pdb: ala2/ala2.pdb
forcefield:
  - amber14-all.xml
  - amber14/tip3pfb.xml
ph: 7.0
padding: 1.0
water_model: tip3p

num_steps: 50000000
output_freq: 100
report_interval: 100
temperature: 360
friction: 1.0
timestep: 0.002

slurm:
  job_name: md-alanine-dipeptide-openmm
  partition: a30
  gres: gpu:1
  time: 0-40:00:00
  mem: 20G
