# Fine-tune the transferable CGSchNet model on trp-cage at 330 K - A30 revision.
#
#   mlcg-train_h5 fit --config configs/training/trpcage-cgschnet-finetune-330K-a30.yaml \
#       --trainer.default_root_dir data/models/cgschnet/finetune_330K_a30/ft-lr3e-4 \
#       --optimizer.init_args.lr 3.0e-4
#
# Target is `cg_delta_forces`: SchNet is the only parametric term in the checkpoint (324,480
# parameters; all 51 analytic priors are buffers), so it learns the residual the priors get
# wrong and the priors are added back afterwards with `mlcg-combine_model`. On this dataset
# the priors already explain ~82% of the force variance.
#
# What this revision changes, and why. The first run (batch 16 x 8, lr 1e-4, ReduceLROnPlateau,
# EarlyStopping patience 3) moved the held-out delta-force MSE from 46.68 to 43.99 - a 5.8%
# gain of which essentially all arrived inside epoch 0 (46.68 -> 44.16), with epochs 1-6
# contributing 0.23 before early stopping fired. Three readings of that are consistent with
# the data and they are not distinguishable from one run:
#
#   1. the optimiser barely left the pretrained weights (lr 1e-4, effective batch 128, and a
#      plateau scheduler whose patience-2 trigger fires on third-decimal noise);
#   2. 324,480 parameters is the binding constraint;
#   3. the residual is dominated by the irreducible noise of the CG projection, in which case
#      43.99 is close to the achievable floor and there is nothing left to win.
#
# The companion SLURM array (slurm/trpcage-cgschnet-finetune-330K.sh) separates them: two
# learning rates against this config, plus a same-architecture from-scratch control and a
# 5.5x wider from-scratch arm. Reading (3) is the one that matters for the downstream
# near-exact-PMF use, and it is the one a direct estimate of the noise floor failed to
# establish - nearest-neighbour frame pairs in this dataset are 0.4-0.6 A RMSD apart, far too
# distant for a degenerate-pair estimator, since delta forces are dominated by stiff local
# geometry. Four arms landing together near 43.5-44 bounds that floor from above by
# construction instead.
#
# Schedule changes that follow: cosine annealing over the full 20-epoch budget rather than a
# plateau reducer, and no EarlyStopping - annealing to eta_min is the point, and a callback
# that stops on noise defeats it. ModelCheckpoint still keeps the best three epochs, so a
# too-hot early epoch costs nothing but time.
#
# The PMF being learned is the 330 K one. It is only valid for simulation and evaluation at
# 330 K: the CG PMF is a free energy, F(R;T) = U(R) - T S(R), whose mapping entropy S(R) is
# strongly R-dependent for a folding transition, so the same weights at another temperature
# describe no well-defined ensemble.
#
# Coverage caveat, recorded because it bounds what this model can be trusted for: the
# training set is the 330 K Boltzmann ensemble, hence ~90% folded. Against the transferable
# model's own ensemble, CG Rg 0.60-0.65 nm is covered at 0.9% versus 22.8%, and Rg > 0.85 nm
# at 0.3% versus 4.3%. Force matching is pointwise-unbiased wherever it has data, so the fit
# is sound where the data is - but the delta force is unconstrained in those two bands and
# the model extrapolates there. Uniform coverage would need umbrella sampling, not more MD.

seed_everything: 42

trainer:
  # 20 epochs over 420,000 training frames. The first run managed 6 epochs at ~41 min each on
  # an 8 GB RTX 4060 at batch 16; batch 64 on an A30 (933 GB/s against 272, and this is a
  # scatter-bound GNN) should land near 20 min, so ~7 h. `max_time` is the backstop, not the
  # plan - if it trips, resume with `--ckpt_path <root>/ckpt/last.ckpt`.
  max_epochs: 20
  max_time: "00:23:00:00"
  accelerator: gpu
  devices: 1
  # 32-bit throughout. mlcg-train_h5 already calls set_float32_matmul_precision("high"), so
  # the A30's TF32 tensor cores are used for the matmuls; bf16-mixed is not worth the risk
  # here because the force prediction is a gradient and training differentiates through it.
  precision: 32
  # Overridden per array task - one directory per arm, so `logger.save_dir` and the
  # checkpoint `dirpath` follow it through mlcg's "default_root_dir" substitution.
  default_root_dir: data/models/cgschnet/finetune_330K_a30/ft
  gradient_clip_val: 10.0
  # Batch 64 in the partitions x 4 here = an effective batch of 256, matched across every arm
  # of the sweep. Force matching against instantaneous mapped forces has a very low
  # signal-to-noise ratio per sample, so a larger effective batch is what makes the higher
  # learning rates below usable rather than destructive.
  accumulate_grad_batches: 4
  log_every_n_steps: 100
  enable_progress_bar: false
  # Must be a list, and every entry needs an init_args block: mlcg's CLI enumerates both
  # `logger` and `callbacks` to substitute the literal "default_root_dir" (-> the root dir
  # itself for save_dir, -> <root>/ckpt for a callback dirpath).
  logger:
    - class_path: pytorch_lightning.loggers.CSVLogger
      init_args:
        save_dir: default_root_dir
        name: csv
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: default_root_dir
        filename: "finetune-{epoch:03d}-{validation_loss:.4f}"
        monitor: validation_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

# The CLI fixes model_class=PLModel and datamodule_class=H5DataModule, so these sections
# carry those classes' arguments directly - a class_path/init_args wrapper is rejected.
model:
  model:
    # Starts from the pretrained SchNet term rather than a fresh one - that is what makes
    # this a fine-tune. Returns the checkpoint's own GradientsOut module, so state-dict keys
    # stay in the layout `mlcg-combine_model` expects.
    class_path: md_simulations.prep.cgschnet_finetune.PretrainedSchNet
    init_args:
      model_file: data/models/cgschnet/transferable_model_and_prior.reexport.pt
      device: cpu
  # PLModel wants an mlcg Loss container, which holds a list of the actual loss terms;
  # ForceMSE on its own is not a Loss subclass and is rejected.
  loss:
    class_path: mlcg.nn.losses.Loss
    init_args:
      losses:
        - class_path: mlcg.nn.losses.ForceMSE
          init_args:
            force_kwd: forces

data:
  h5_file_path: data/trp-cage/fm_330K/trpcage_bysegment.h5
  # Passed as paths, not inline mappings: partition_options/loading_options are typed
  # Union[Mapping, str], and an inline mapping makes jsonargparse expand every nested key
  # into a CLI option and reject it. A str is loaded as YAML by the data module.
  partition_options: configs/training/trpcage-partitions-330K-b64.yaml
  loading_options: configs/training/trpcage-loading-330K.yaml

# lr is overridden per array task (3e-4 and 1e-3). Both are above the 1e-4 of the first run,
# which is the point: at effective batch 240 the gradient is clean enough to take real steps,
# and staying near the pretrained weights is the hypothesis under test, not a constraint.
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 3.0e-4
    weight_decay: 0.0

# Plain torch CosineAnnealingLR: it needs no monitored metric, so unlike ReduceLROnPlateau it
# does not need pytorch_lightning.cli's wrapper. Lightning steps it once per epoch by default,
# so T_max is in epochs and must match trainer.max_epochs.
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 20
    eta_min: 1.0e-6
