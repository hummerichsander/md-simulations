# Train/validation split for configs/training/ala16-cgschnet-scratch-330K.yaml. The 8 ns after
# the 2 ns burn-in are cut into eight 1 ns blocks and the last is held out whole, as for ala2.
# Training reads every 4th frame (80 fs apart), so 50 epochs fit one 40 h a30 job.

train:
  metasets:
    ala16:
      molecules: [seg00, seg01, seg02, seg03, seg04, seg05, seg06]
      stride: 4
  batch_sizes:
    ala16: 64
  subsample_random_seed: 42

val:
  metasets:
    ala16:
      molecules: [seg07]
      stride: 5
  batch_sizes:
    ala16: 64
  subsample_random_seed: 42
