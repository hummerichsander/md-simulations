# Train/validation split for configs/training/ala12-cgschnet-scratch-330K.yaml. The 8 ns after
# the 2 ns burn-in are cut into eight 1 ns blocks and the last is held out whole, as for ala2.
# Training reads every 2th frame (40 fs apart), so 50 epochs fit one 40 h a30 job.

train:
  metasets:
    ala12:
      molecules: [seg00, seg01, seg02, seg03, seg04, seg05, seg06]
      stride: 2
  batch_sizes:
    ala12: 256
  subsample_random_seed: 42

val:
  metasets:
    ala12:
      molecules: [seg07]
      stride: 5
  batch_sizes:
    ala12: 256
  subsample_random_seed: 42
