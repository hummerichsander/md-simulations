# Trp-cage 330 K force matching from a *randomly initialised* SchNet - the architectural
# control for the fine-tuning sweep.
#
#   mlcg-train_h5 fit --config configs/training/trpcage-cgschnet-scratch128-330K-a30.yaml
#
# Every hyperparameter of the network is read off the transferable checkpoint, so this
# reproduces its SchNet term exactly at 324,480 parameters - only the weights are fresh. That
# makes the comparison against the fine-tuned arms a clean one:
#
#   * scratch clearly worse than fine-tuned  -> the pretrained representation transfers, and
#     the 5.8% the first run gained is a real (small) top-up on a good starting point.
#   * scratch matches fine-tuned             -> the pretrained weights contribute nothing on
#     420,000 frames of this one protein; the model is simply at capacity, and the 5.5x wider
#     arm is where to look.
#   * scratch better than fine-tuned         -> the pretrained weights are a handicap here,
#     i.e. a local optimum shaped by the multi-protein training set that a fine-tune at these
#     learning rates cannot leave.
#
# lr 1e-3 rather than the fine-tune's 3e-4: there is no pretrained solution to preserve, so
# the usual argument for a small step does not apply.
#
# The physics caveats of the fine-tune config apply unchanged - this is the 330 K PMF, valid
# only at 330 K, fit on an ensemble that is ~90% folded. See
# configs/training/trpcage-cgschnet-finetune-330K-a30.yaml for both in full.

seed_everything: 42

trainer:
  max_epochs: 20
  max_time: "00:23:00:00"
  accelerator: gpu
  devices: 1
  precision: 32
  default_root_dir: data/models/cgschnet/finetune_330K_a30/scratch128
  gradient_clip_val: 10.0
  # 64 x 4 = effective batch 256, matched to every other arm of the sweep.
  accumulate_grad_batches: 4
  log_every_n_steps: 100
  enable_progress_bar: false
  logger:
    - class_path: pytorch_lightning.loggers.CSVLogger
      init_args:
        save_dir: default_root_dir
        name: csv
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: default_root_dir
        filename: "scratch128-{epoch:03d}-{validation_loss:.4f}"
        monitor: validation_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  model:
    # GradientsOut is what turns the predicted energy into the `forces` the loss compares
    # against, and `mlcg-combine_model` keys the merged model on `model.name` - which
    # StandardSchNet sets to "SchNet", the name the simulation side expects.
    class_path: mlcg.nn.GradientsOut
    init_args:
      targets: forces
      model:
        class_path: mlcg.nn.StandardSchNet
        init_args:
          # ExpNormalBasis(CosineCutoff(0, 15 A), num_rbf=64, trainable=False) and
          # hidden/filters 128 x 4 interaction blocks with a [128, 64] output MLP: verified to
          # give 324,480 parameters, matching the checkpoint's SchNet term exactly.
          rbf_layer:
            class_path: mlcg.nn.radial_basis.ExpNormalBasis
            init_args:
              cutoff:
                class_path: mlcg.nn.cutoff.CosineCutoff
                init_args:
                  cutoff_lower: 0.0
                  cutoff_upper: 15.0
              num_rbf: 64
              trainable: false
          cutoff:
            class_path: mlcg.nn.cutoff.CosineCutoff
            init_args:
              cutoff_lower: 0.0
              cutoff_upper: 15.0
          output_hidden_layer_widths: [128, 64]
          hidden_channels: 128
          num_filters: 128
          num_interactions: 4
          # 25, from the checkpoint's Embedding(25, 128). Our embeddings run 1-24, so 25 is
          # the minimum that indexes them; keeping the checkpoint's value also means a
          # state_dict from this arm stays shape-compatible with one from a fine-tune arm.
          embedding_size: 25
          activation:
            class_path: torch.nn.Tanh
          max_num_neighbors: 1000
          aggr: add
  loss:
    class_path: mlcg.nn.losses.Loss
    init_args:
      losses:
        - class_path: mlcg.nn.losses.ForceMSE
          init_args:
            force_kwd: forces

data:
  h5_file_path: data/trp-cage/fm_330K/trpcage_bysegment.h5
  partition_options: configs/training/trpcage-partitions-330K-b64.yaml
  loading_options: configs/training/trpcage-loading-330K.yaml

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-3
    weight_decay: 0.0

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 20
    eta_min: 1.0e-6
