# Alanine dipeptide (AL_CG_MAP: ACE C, ALA N CA CB C, NME N) at 330 K, force matching a
# randomly initialised SchNet on top of priors fit by `md-sim-cgschnet-priors`.
#
#   mlcg-train_h5 fit --config configs/training/ala2-cgschnet-scratch-330K.yaml
#
# The network is the trp-cage scratch128 arm's. At 6 beads the 15 A radius graph is all-pairs
# and costs nothing, so the batch is large and there is no gradient accumulation. The priors
# are added back afterwards with `mlcg-combine_model` (see slurm/ala2-cgschnet-scratch-330K.sh).
#
# Valid only at 330 K: force matching fits the PMF of the ensemble it was trained on.

seed_everything: 42

trainer:
  max_epochs: 50
  max_time: "00:23:00:00"
  accelerator: gpu
  devices: 1
  precision: 32
  default_root_dir: data/models/cgschnet/ala2_scratch_330K
  gradient_clip_val: 10.0
  log_every_n_steps: 100
  enable_progress_bar: false
  logger:
    - class_path: pytorch_lightning.loggers.CSVLogger
      init_args:
        save_dir: default_root_dir
        name: csv
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: default_root_dir
        filename: "ala2-{epoch:03d}-{validation_loss:.4f}"
        monitor: validation_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  model:
    # GradientsOut is what turns the predicted energy into the `forces` the loss compares
    # against, and `mlcg-combine_model` keys the merged model on `model.name` - which
    # StandardSchNet sets to "SchNet", the name the simulation side expects.
    class_path: mlcg.nn.GradientsOut
    init_args:
      targets: forces
      model:
        class_path: mlcg.nn.StandardSchNet
        init_args:
          rbf_layer:
            class_path: mlcg.nn.radial_basis.ExpNormalBasis
            init_args:
              cutoff:
                class_path: mlcg.nn.cutoff.CosineCutoff
                init_args:
                  cutoff_lower: 0.0
                  cutoff_upper: 15.0
              num_rbf: 64
              trainable: false
          cutoff:
            class_path: mlcg.nn.cutoff.CosineCutoff
            init_args:
              cutoff_lower: 0.0
              cutoff_upper: 15.0
          output_hidden_layer_widths: [128, 64]
          hidden_channels: 128
          num_filters: 128
          num_interactions: 4
          # one type per bead, 0-5.
          embedding_size: 6
          activation:
            class_path: torch.nn.Tanh
          max_num_neighbors: 1000
          aggr: add
  loss:
    class_path: mlcg.nn.losses.Loss
    init_args:
      losses:
        - class_path: mlcg.nn.losses.ForceMSE
          init_args:
            force_kwd: forces

data:
  h5_file_path: data/alaX/ala2_fm_330K/ala2_bysegment.h5
  partition_options: configs/training/ala2-partitions-330K.yaml
  loading_options: configs/training/ala2-loading-330K.yaml

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-3
    weight_decay: 0.0

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 50
    eta_min: 1.0e-6
