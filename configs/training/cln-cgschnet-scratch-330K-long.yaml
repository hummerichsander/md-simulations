# Chignolin (1UAO, mlcg 5-bead map N CA CB C O, 47 beads) at 330 K, force matching a randomly
# initialised SchNet on top of priors fit by `md-sim-cgschnet-priors --scheme protein`, i.e. the
# transferable model's terms (per-residue phi/psi, omega, gamma_1/2, non_bonded).
#
#   mlcg-train_h5 fit --config configs/training/cln-cgschnet-scratch-330K-long.yaml
#
# The long twin of cln-cgschnet-scratch-330K.yaml: 150 epochs instead of 30, the cosine
# schedule stretched to match. The 30-epoch run was still improving (validation ForceMSE
# 28.21, -0.01 per epoch) when its schedule annealed the lr to ~4e-6; mid-run it fell
# ~0.05 per epoch. At ~10.4 min per epoch on an a30 this is ~26 h.
#
# The network is the trp-cage scratch128 arm's, the ala2 recipe otherwise. The data are the eight
# 500 ns replicas of configs/cln-amber14-implicit-330K-rNN.yaml (10 ns burn-in dropped, 5 ps
# apart); replica r07 is held out whole. The priors are added back afterwards with
# `mlcg-combine_model` (see slurm/cln-cgschnet-scratch-330K.sh).
#
# Valid only at 330 K: force matching fits the PMF of the ensemble it was trained on, here ~10 %
# folded.

seed_everything: 42

trainer:
  max_epochs: 150
  max_time: "01:12:00:00"
  accelerator: gpu
  devices: 1
  precision: 32
  default_root_dir: data/models/cgschnet/cln_scratch_330K_long
  gradient_clip_val: 10.0
  log_every_n_steps: 100
  enable_progress_bar: false
  logger:
    - class_path: pytorch_lightning.loggers.CSVLogger
      init_args:
        save_dir: default_root_dir
        name: csv
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: default_root_dir
        filename: "cln-{epoch:03d}-{validation_loss:.4f}"
        monitor: validation_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  model:
    # GradientsOut is what turns the predicted energy into the `forces` the loss compares
    # against, and `mlcg-combine_model` keys the merged model on `model.name` - which
    # StandardSchNet sets to "SchNet", the name the simulation side expects.
    class_path: mlcg.nn.GradientsOut
    init_args:
      targets: forces
      model:
        class_path: mlcg.nn.StandardSchNet
        init_args:
          rbf_layer:
            class_path: mlcg.nn.radial_basis.ExpNormalBasis
            init_args:
              cutoff:
                class_path: mlcg.nn.cutoff.CosineCutoff
                init_args:
                  cutoff_lower: 0.0
                  cutoff_upper: 15.0
              num_rbf: 64
              trainable: false
          cutoff:
            class_path: mlcg.nn.cutoff.CosineCutoff
            init_args:
              cutoff_lower: 0.0
              cutoff_upper: 15.0
          output_hidden_layer_widths: [128, 64]
          hidden_channels: 128
          num_filters: 128
          num_interactions: 4
          # bead_types: CA by residue (G Y D P E T W) plus N, CB, C, O.
          embedding_size: 11
          activation:
            class_path: torch.nn.Tanh
          max_num_neighbors: 1000
          aggr: add
  loss:
    class_path: mlcg.nn.losses.Loss
    init_args:
      losses:
        - class_path: mlcg.nn.losses.ForceMSE
          init_args:
            force_kwd: forces

data:
  h5_file_path: data/cln/cln_fm_330K/cln_bysegment.h5
  partition_options: configs/training/cln-partitions-330K.yaml
  loading_options: configs/training/cln-loading-330K.yaml

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-3
    weight_decay: 0.0

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 150
    eta_min: 1.0e-6
