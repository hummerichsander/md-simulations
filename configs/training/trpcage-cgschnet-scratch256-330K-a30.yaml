# Trp-cage 330 K force matching with a 5.5x wider SchNet - the capacity probe.
#
#   mlcg-train_h5 fit --config configs/training/trpcage-cgschnet-scratch256-330K-a30.yaml
#
# hidden/filters 256 and 6 interaction blocks with a [256, 128] output MLP: 1,780,992
# parameters against the checkpoint's 324,480. This is the arm that answers the question the
# first fine-tune could not - whether the residual delta-force MSE of ~44 is the model running
# out of capacity or the irreducible noise of the CG projection.
#
#   * clearly below the 128-wide arms -> capacity-limited. For the downstream near-exact-PMF
#     use that is the important outcome, and it means the transferable checkpoint's
#     architecture, not the dataset, is what to change. Note the cost: this arm cannot be
#     warm-started from the checkpoint (different tensor shapes), so going this way means
#     giving up transferability and training this system's potential from scratch.
#   * level with them -> the floor is noise, ~44 is essentially it, and more parameters, more
#     epochs and more frames all buy nothing. Four arms agreeing is a far more trustworthy
#     bound on that floor than the degenerate-pair estimator, which failed on this data
#     because nearest-neighbour frames are 0.4-0.6 A RMSD apart.
#
# It must be trained from scratch, so it is not a fine-tune and is not a candidate for
# `mlcg-combine_model` unless it wins outright.
#
# The physics caveats of the fine-tune config apply unchanged - this is the 330 K PMF, valid
# only at 330 K, fit on an ensemble that is ~90% folded. See
# configs/training/trpcage-cgschnet-finetune-330K-a30.yaml for both in full.

seed_everything: 42

trainer:
  max_epochs: 20
  max_time: "00:23:00:00"
  accelerator: gpu
  devices: 1
  precision: 32
  default_root_dir: data/models/cgschnet/finetune_330K_a30/scratch256
  gradient_clip_val: 10.0
  # 16 x 16 = effective batch 256, matched to the 64 x 4 of the 128-wide arms so the four arms
  # are compared at one gradient-noise level. The native batch has to drop from 64 because
  # peak allocation for this network measures 4.35 / 6.51 GiB at batches of 8 / 12 - 553 MB
  # per sample against the 196 MB of the 128-wide network, so batch 16 is ~8.7 GiB and batch
  # 32 would be ~17.3 GiB. 16 it is: this is the slowest arm and the one most likely to reach
  # `max_time`, but an OOM half a day in costs more than the throughput. Raise it to 24
  # (~13 GiB, `accumulate_grad_batches: 11`) if the arm turns out to be the interesting one.
  accumulate_grad_batches: 16
  log_every_n_steps: 100
  enable_progress_bar: false
  logger:
    - class_path: pytorch_lightning.loggers.CSVLogger
      init_args:
        save_dir: default_root_dir
        name: csv
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: default_root_dir
        filename: "scratch256-{epoch:03d}-{validation_loss:.4f}"
        monitor: validation_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  model:
    class_path: mlcg.nn.GradientsOut
    init_args:
      targets: forces
      model:
        class_path: mlcg.nn.StandardSchNet
        init_args:
          # Cutoff, basis and activation are left exactly as the checkpoint has them, so width
          # and depth are the only things that differ from the scratch128 control.
          rbf_layer:
            class_path: mlcg.nn.radial_basis.ExpNormalBasis
            init_args:
              cutoff:
                class_path: mlcg.nn.cutoff.CosineCutoff
                init_args:
                  cutoff_lower: 0.0
                  cutoff_upper: 15.0
              num_rbf: 64
              trainable: false
          cutoff:
            class_path: mlcg.nn.cutoff.CosineCutoff
            init_args:
              cutoff_lower: 0.0
              cutoff_upper: 15.0
          output_hidden_layer_widths: [256, 128]
          hidden_channels: 256
          num_filters: 256
          num_interactions: 6
          embedding_size: 25
          activation:
            class_path: torch.nn.Tanh
          max_num_neighbors: 1000
          aggr: add
  loss:
    class_path: mlcg.nn.losses.Loss
    init_args:
      losses:
        - class_path: mlcg.nn.losses.ForceMSE
          init_args:
            force_kwd: forces

data:
  h5_file_path: data/trp-cage/fm_330K/trpcage_bysegment.h5
  # Batch 16 partitions, reused from the first run's config.
  partition_options: configs/training/trpcage-partitions-330K.yaml
  loading_options: configs/training/trpcage-loading-330K.yaml

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-3
    weight_decay: 0.0

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 20
    eta_min: 1.0e-6
