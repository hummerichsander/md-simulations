# Train/validation split for configs/training/cln-cgschnet-scratch-330K.yaml; its own file for
# the jsonargparse reason given in trpcage-partitions-330K.yaml.
#
# `md-sim-cgschnet-priors` cuts each of the eight replicas into ten contiguous ~49 ns blocks
# (seg00-09 is r00, ..., seg70-79 is r07), and replica r07 is held out whole: frames 5 ps apart
# are near-duplicates, so a random frame split would report a validation loss that merely
# echoes the training loss.

train:
  metasets:
    cln:
      molecules: [
        seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09,
        seg10, seg11, seg12, seg13, seg14, seg15, seg16, seg17, seg18, seg19,
        seg20, seg21, seg22, seg23, seg24, seg25, seg26, seg27, seg28, seg29,
        seg30, seg31, seg32, seg33, seg34, seg35, seg36, seg37, seg38, seg39,
        seg40, seg41, seg42, seg43, seg44, seg45, seg46, seg47, seg48, seg49,
        seg50, seg51, seg52, seg53, seg54, seg55, seg56, seg57, seg58, seg59,
        seg60, seg61, seg62, seg63, seg64, seg65, seg66, seg67, seg68, seg69,
      ]
      stride: 1
  # "batch_sizes", plural: see trpcage-partitions-330K.yaml.
  batch_sizes:
    cln: 256
  subsample_random_seed: 42

val:
  metasets:
    cln:
      molecules: [seg70, seg71, seg72, seg73, seg74, seg75, seg76, seg77, seg78, seg79]
      stride: 5
  batch_sizes:
    cln: 256
  subsample_random_seed: 42
