# ACE-(ALA)8-NME, CGSchNet trained from scratch at 330 K on 34 beads (ACE C, N CA C CB per
# Ala, NME N); model_file comes from SYSTEM=ala8 slurm/alaX-cgschnet-scratch-330K.sh.
engine: cgschnet
system: ala8
output_subdir: alaX/ala8_CGSchNet_330K

input_pdb: pdbs/ala8_34B-CG.pdb
configurations_file: alaX/ala8_fm_330K/configurations.pt
model_file: models/cgschnet/ala8_scratch_330K.pt

device: cuda
dtype: float32
model_energy_unit: kcal/mol
replica: 0
n_replicas: 32

num_steps: 2500000
output_freq: 250
report_interval: 1000
temperature: 330
friction: 1.0
timestep: 0.002

slurm:
  job_name: ala8-cgschnet-330K
  partition: gshort
  gres: gpu:1
  time: 0-24:00:00
  mem: 20G
