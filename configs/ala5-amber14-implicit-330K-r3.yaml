# Poly-alanine ala5, all-atom AMBER14 + GBn2 implicit solvent, 330 K, replica r3.
#
# An independent copy of the r0 run (alaX/ala5_AMBER14_implicit_330K, instantiated from
# alaX-amber14-implicit-330K.yaml): same ideal alpha-helix start (pdbs/ala5.pdb), integrator,
# output and frame spacing. Only output_subdir, the beamtime block and the slurm block differ.
# Independence comes from OpenMM drawing a fresh velocity seed and Langevin seed per run (nothing
# here pins one); Modeller.addHydrogens also places the hydrogens with an unseeded RNG, so the
# starting H coordinates differ per run while the heavy atoms are identical.
#
# r0-r3 are the reference set of the split-flows Boltzmann-generator benchmark (r0-r2 train, r3 is
# the independent holdout). 10 ns = 5,000,000 frames at 2 fs; split-flows drops the first 2 ns
# (1,000,000 frames) as burn-in. H-resample with slurm/resample-h-bonds-alaX.sh (REPLICAS=...).
engine: amber
system: ala5
output_subdir: alaX/ala5_AMBER14_implicit_330K-r3
beamtime:
  group: alaX/ala5_AMBER14_implicit_330K
  name: r3

input_pdb: pdbs/ala5.pdb
forcefield:
  - amber14-all.xml
  - implicit/gbn2.xml
ph: 7.0
implicit_solvent: true
salt_conc: 0.0
nonbonded_cutoff: 2.0

num_steps: 5000000        # 5,000,000 steps = 10 ns
output_freq: 1            # save every 1 steps = 2 fs -> 5,000,000 frames
report_interval: 50000    # stdout log every 100 ps (logging only, not data)
temperature: 330
friction: 1.0
timestep: 0.002
integrator: langevin_middle
