# Chignolin (1UAO), fiber baseline for split-flows backmapping: representative 3 of 6,
# "folded" (11% of the ensemble, Q = 0.82, frame 76417 of traj_amber14_hresampled).
#
# The 47 slow atoms (N CA CB C O per residue, no CB on Gly) are frozen, so this run samples the
# Boltzmann distribution of the 91 fast dofs *conditioned* on that backbone -- exactly the fiber
# the normalizing flow in ../split-flows-public backmaps into (its cg_map is an atom-selection
# map over the same 47 indices, so P_slow holds precisely these atoms fixed). This is the MD arm
# of the efficiency comparison: how long constrained MD must run to decorrelate the sidechains,
# against drawing independent flow samples.
#
# Freezing is by zero mass, which takes the slow atoms out of the equations of motion exactly;
# a stiff restraint would leave a thermal smear on the very coordinates the fiber is defined by.
# That forces `constraints: none`: 36 of the 61 X-H constraints touch a frozen atom and OpenMM
# cannot constrain a massless particle. Hence explicit X-H stretches (~11 fs period) and a 0.5 fs
# timestep, as in configs/cln-amber14-implicit-unconstrained-330K.yaml.
#
# `constraints: none` is also what this baseline *wants*: the chignolin reference dataset is being
# re-created in the unconstrained potential, by equilibrating the constrained trajectory in it.
# Both sides of the comparison then live in one force field, with no X-H resampling in between, so
# nothing is post-processed here. Temperature, friction and force field otherwise match the
# production runs the flow was trained on (cln-amber14-implicit-330K-r00..r07).
engine: amber
system: cln
output_subdir: cln/fiber_AMBER14_implicit_330K_rep3
beamtime:
  group: cln/fiber_AMBER14_implicit_330K
  name: rep3

# Written by md-sim-extract-frames from split-flows-public/data/cln-ms/representatives.trr.
input_pdb: pdbs/cln-rep3.pdb
forcefield:
  - amber14-all.xml
  - implicit/gbn2.xml
ph: 7.0
implicit_solvent: true
salt_conc: 0.0
nonbonded_cutoff: 2.0
constraints: none           # required: 36 of the 61 X-H constraints touch a frozen atom

frozen_atoms:
  names: [N, CA, CB, C, O]  # the flow's slow subspace, mlcg's 5 beads per residue
  expect_count: 47          # guards against a topology this selection was not written for

num_steps: 100000000        # 50 ns at 0.5 fs
output_freq: 2000           # 1 ps spacing -> 50,000 frames
report_interval: 200000     # 100 ps
temperature: 330
friction: 1.0
timestep: 0.0005
integrator: langevin_middle
minimize_energy: false      # the frame is already equilibrated under this force field at 330 K;
                            # minimising would bias the starting rotamer
write_forces: false         # a fiber baseline needs coordinates, not force-matching data
